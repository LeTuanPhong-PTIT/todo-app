<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Quản lý công việc</h2>
        
        <!-- Giao diện nhập công việc -->

            <input type="text" id="todo-input" placeholder="Học Git hôm nay...">
            <button id="add-btn">Thêm</button>
        </div>

        <!-- Danh sách công việc -->
        <ul id="todo-list">
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
